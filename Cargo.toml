[package]
name = "winshortcutsorganizer"
version = "0.2.6"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
ico = "0.5.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
inquire = "0.9.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"
windows = { version = "0.62.2", features = ["Win32_System_Console", "Win32_System_Registry", "Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_UI_Shell_Common", "Win32_Storage_FileSystem"] }

[[bin]]
name = "wso"
path = "src/main.rs"
