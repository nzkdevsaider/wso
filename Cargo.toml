[package]
name = "winshortcuts-organizer"
version = "0.1.0"
edition = "2021"

[dependencies]
ico = "0.5.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
windows = { version = "0.62.2", features = ["Win32_System_Registry", "Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[[bin]]
name = "wso"
path = "src/main.rs"
